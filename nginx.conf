upstream recon_api {
    # 轮询分发到两个 API 进程，二者共用同一 SQLite 数据库文件
    server api1:8000;
    server api2:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://recon_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
