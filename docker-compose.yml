services:
  api1:
    build: .
    environment:
      RECON_DB: /data/recon.db
    volumes:
      - recon-data:/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  api2:
    build: .
    environment:
      RECON_DB: /data/recon.db
    volumes:
      - recon-data:/data   # 与 api1 挂载同一命名卷：两个 API 进程共用一个 SQLite 库
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started

volumes:
  recon-data:
